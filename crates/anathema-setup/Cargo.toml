[package]
name = "anathema-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "anathema_setup"
path = "src/lib.rs"

[[bin]]
name = "anathema-setup"
path = "src/main.rs"

[[bin]]
name = "anathema-esp"
path = "src/bin/esp.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
